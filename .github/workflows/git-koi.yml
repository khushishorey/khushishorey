name: Update Git Koi

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  # Allows you to run the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: yalongwastaken/git-profile-koi@v1.0.2

